    // ========== WEBSITE ANALYTICS ==========
    function getOrCreateVisitorId() {
        let visitorId = localStorage.getItem('visitorId');
        if(!visitorId) {
            visitorId = 'visitor_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
            localStorage.setItem('visitorId', visitorId);
            
            const visitInfo = {
                visitorId: visitorId,
                firstVisit: new Date().toISOString(),
                pagesVisited: [window.location.pathname],
                totalVisits: 1
            };
            localStorage.setItem('visitorInfo', JSON.stringify(visitInfo));
        } else {
            const visitInfo = JSON.parse(localStorage.getItem('visitorInfo') || '{}');
            visitInfo.totalVisits = (visitInfo.totalVisits || 0) + 1;
            if(!visitInfo.pagesVisited.includes(window.location.pathname)) {
                visitInfo.pagesVisited.push(window.location.pathname);
            }
            localStorage.setItem('visitorInfo', JSON.stringify(visitInfo));
        }
        return visitorId;
    }
    
    function trackPageView() {
        getOrCreateVisitorId();
        const pageViews = JSON.parse(localStorage.getItem('pageViews') || '[]');
        pageViews.push({
            page: window.location.pathname,
            timestamp: new Date().toISOString(),
            referrer: document.referrer || 'direct',
            userAgent: navigator.userAgent
        });
        localStorage.setItem('pageViews', JSON.stringify(pageViews));
    }
    
    function trackButtonClick(buttonName, buttonLocation) {
        const clicks = JSON.parse(localStorage.getItem('buttonClicks') || '[]');
        clicks.push({
            buttonName: buttonName,
            location: buttonLocation,
            timestamp: new Date().toISOString(),
            page: window.location.pathname
        });
        localStorage.setItem('buttonClicks', JSON.stringify(clicks));
    }
    
    let maxScrollDepth = 0;
    function trackScrollDepth() {
        const scrollPercent = (window.scrollY + window.innerHeight) / document.documentElement.scrollHeight * 100;
        if(scrollPercent > maxScrollDepth) {
            const newDepth = Math.min(Math.floor(scrollPercent / 25) * 25, 100);
            if(newDepth > maxScrollDepth && newDepth > 0) {
                maxScrollDepth = newDepth;
                const scrollData = JSON.parse(localStorage.getItem('scrollDepth') || '[]');
                scrollData.push({
                    depth: maxScrollDepth,
                    timestamp: new Date().toISOString(),
                    page: window.location.pathname
                });
                localStorage.setItem('scrollDepth', JSON.stringify(scrollData));
            }
        }
    }

    async function loadContactInfoFromSupabase() {

        if(personalData && personalData[0]) {

        }
        
        const { data: chatData } = await supabaseClient
            .from('chat_settings')
            .select('*')
            .limit(1);
        
        if(chatData && chatData[0]) {
            const chatSettings = chatData[0];
            
            let phoneNumber = chatSettings.whatsapp_number || '254700000000';
            let cleanNumber = phoneNumber.replace(/\D/g, '');
            if (cleanNumber.startsWith('0')) cleanNumber = '254' + cleanNumber.substring(1);
            if (!cleanNumber.startsWith('254') && !cleanNumber.startsWith('+')) cleanNumber = '254' + cleanNumber;
            
            const defaultMessage = chatSettings.message_template || 'Hi, I saw your portfolio website and would like to discuss a potential project.';
            const whatsappLink = `https://wa.me/${cleanNumber}?text=${encodeURIComponent(defaultMessage)}`;
            
            const whatsappDisplay = document.getElementById('whatsappDisplay');
            const whatsappCardLink = document.getElementById('whatsappCardLink');
            if(whatsappDisplay) whatsappDisplay.innerHTML = `Chat on WhatsApp`;
            if(whatsappCardLink) whatsappCardLink.href = whatsappLink;
            
            const facebookPage = chatSettings.facebook_page || 'https://facebook.com/yourpage';
            const facebookDisplay = document.getElementById('facebookDisplay');
            const facebookCardLink = document.getElementById('facebookCardLink');
            if(facebookDisplay) facebookDisplay.innerHTML = `Message on Facebook`;
            if(facebookCardLink) facebookCardLink.href = facebookPage;
        }
    }
    
    async function loadFAQsFromSupabase() {
        const { data: faqsData } = await supabaseClient
            .from('faqs')
            .select('*')
            .order('display_order', { ascending: true });
        
        if(faqsData && faqsData.length > 0) {
            faqItems = faqsData;
        } else {
            faqItems = [
                { question: "How quickly can you start working on my project?", answer: "I typically respond within 24 hours. Once we agree on the scope, I can start immediately or schedule according to your timeline." },
                { question: "What is your typical turnaround time?", answer: "Turnaround time depends on project scope. A landing page usually takes 3-5 days, email sequences 5-7 days, and full website copy 7-14 days." },
                { question: "Do you offer revisions?", answer: "Absolutely! All my packages include 2-3 rounds of revisions to ensure you're completely satisfied." }
            ];
        }
        renderFAQs();
    }
    
    async function saveLeadToSupabase(leadData) {
        const { data, error } = await supabaseClient
            .from('contact_leads')
            .insert([leadData]);
        
        if(error) {
            console.error('Error saving lead:', error);
            return false;
        }
        return true;
    }
    
    // ========== FAQ MANAGEMENT ==========
    let faqItems = [];
    
    function renderFAQs() {
        const container = document.getElementById('faqGrid');
        if(!container) return;
        
        if(!faqItems || faqItems.length === 0) {
            container.innerHTML = '<div class="empty-faq">✨ No FAQs yet. Add some in the admin panel!</div>';
            return;
        }
        
        container.innerHTML = faqItems.map((item, index) => `
            <div class="faq-item" onclick="toggleFAQ(${index})">
                <div class="faq-question">
                    <span>${escapeHtml(item.question)}</span>
                    <span class="faq-icon">+</span>
                </div>
                <div class="faq-answer">
                    ${escapeHtml(item.answer)}
                </div>
            </div>
        `).join('');
    }
    
    function toggleFAQ(index) {
        const items = document.querySelectorAll('.faq-item');
        const clickedItem = items[index];
        
        if(clickedItem.classList.contains('active')) {
            clickedItem.classList.remove('active');
        } else {
            items.forEach(item => item.classList.remove('active'));
            clickedItem.classList.add('active');
        }
    }
    
    window.toggleFAQ = toggleFAQ;
    
    // ========== CONTACT FORM HANDLER ==========
    const contactForm = document.getElementById('contactForm');
    const nameInput = document.getElementById('contactName');
    const emailInput = document.getElementById('contactEmail');
    const messageInput = document.getElementById('contactMessage');
    const nameError = document.getElementById('nameError');
    const emailError = document.getElementById('emailError');
    const messageError = document.getElementById('messageError');
    const formSuccess = document.getElementById('formSuccess');
    
    function validateEmail(email) {
        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    }
    
    if(contactForm) {
        contactForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            let isValid = true;
    
            if (!nameInput.value.trim()) {
                nameError.style.display = "block";
                isValid = false;
            } else {
                nameError.style.display = "none";
            }
    
            if (!validateEmail(emailInput.value)) {
                emailError.style.display = "block";
                isValid = false;
            } else {
                emailError.style.display = "none";
            }
    
            if (!messageInput.value.trim()) {
                messageError.style.display = "block";
                isValid = false;
            } else {
                messageError.style.display = "none";
            }
    
            if (isValid) {
                const leadData = {
                    name: nameInput.value,
                    email: emailInput.value,
                    company: document.getElementById('contactCompany').value,
                    message: messageInput.value,
                    status: 'new',
                    created_at: new Date().toISOString()
                };
                
                const saved = await saveLeadToSupabase(leadData);
                
                if(saved) {
                    formSuccess.style.display = "block";
                    contactForm.reset();
                    setTimeout(() => {
                        formSuccess.style.display = "none";
                    }, 5000);
                } else {
                    const leads = JSON.parse(localStorage.getItem('contactLeads') || '[]');
                    leads.push(leadData);
                    localStorage.setItem('contactLeads', JSON.stringify(leads));
                    
                    formSuccess.style.display = "block";
                    contactForm.reset();
                    setTimeout(() => {
                        formSuccess.style.display = "none";
                    }, 5000);
                }
            }
        });
    
        nameInput.addEventListener('input', () => {
            if (nameInput.value.trim()) nameError.style.display = "none";
        });
        emailInput.addEventListener('input', () => {
            if (validateEmail(emailInput.value)) emailError.style.display = "none";
        });
        messageInput.addEventListener('input', () => {
            if (messageInput.value.trim()) messageError.style.display = "none";
        });
    }

    const facebookCard = document.getElementById('facebookCardLink');

    if(facebookCard) {

    // Apply design settings
    function applyDesignSettings() {
        const designSettings = JSON.parse(localStorage.getItem('designSettings') || '{}');
        if(designSettings.colors) {
            document.documentElement.style.setProperty('--accent', designSettings.colors.primary || '#818cf8');
            document.documentElement.style.setProperty('--accent-hover', designSettings.colors.secondary || '#6366f1');
            document.documentElement.style.setProperty('--bg-primary', designSettings.colors.background || '#f8fafc');
            document.documentElement.style.setProperty('--bg-card', designSettings.colors.cardBg || '#ffffff');
        }
    }
    
    // ========== MULTI-OPTION CHAT BUTTON ==========

        const emailBody = encodeURIComponent(chatSettings.emailBody || defaultMessage);

        const emailOption = document.getElementById('emailOption');
        if (emailOption) emailOption.href = emailLink;
        
        const facebookPage = chatSettings.facebookPage || 'https://facebook.com/yourpage';
        const facebookOption = document.getElementById('facebookOption');
        if (facebookOption) facebookOption.href = facebookPage;
    }
    
    // Multi-float button toggle
    const chatMainBtn = document.getElementById('chatMainBtn');
    const chatOptionsPanel = document.getElementById('chatOptions');
    const chatCloseBtn = document.getElementById('chatCloseBtn');
    let isChatOpen = false;
    
    function toggleChatOptions() {
        isChatOpen = !isChatOpen;
        if (isChatOpen) {
            chatOptionsPanel.classList.add('active');
        } else {
            chatOptionsPanel.classList.remove('active');
        }
    }
    
    if (chatMainBtn) {
        chatMainBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleChatOptions();
            trackButtonClick('Multi-Float Button', 'Bottom Right');
        });
    }
    
    if (chatCloseBtn) {
        chatCloseBtn.addEventListener('click', () => {
            isChatOpen = false;
            chatOptionsPanel.classList.remove('active');
            trackButtonClick('Close Multi-Float', 'Multi-Float Menu');
        });
    }
    
    document.addEventListener('click', (e) => {
        if (!e.target.closest('.chat-float')) {
            isChatOpen = false;
            if (chatOptionsPanel) chatOptionsPanel.classList.remove('active');
        }
    });
    
    // Dark Mode
    const themeToggle = document.getElementById("themeToggle");
    const body = document.body;
    
    if (localStorage.getItem("darkMode") === "enabled") {
        body.classList.add("dark");
        themeToggle.textContent = "Light mode";
    } else {
        themeToggle.textContent = "Dark mode";
    }
    
    themeToggle.addEventListener("click", () => {
        body.classList.toggle("dark");
        if (body.classList.contains("dark")) {
            localStorage.setItem("darkMode", "enabled");
            themeToggle.textContent = "Light mode";
        } else {
            localStorage.setItem("darkMode", "disabled");
            themeToggle.textContent = "Dark mode";
        }
        trackButtonClick('Dark Mode Toggle', body.classList.contains('dark') ? 'Switch to Dark' : 'Switch to Light');
    });
    
    function escapeHtml(text) {
        if(!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    window.sendMessage = function() { ... } // Keep existing
    
    function initChatbot() {
        const toggle = document.getElementById('chatAgentToggle');

    // ========== INITIALIZE EVERYTHING ==========
    trackPageView();
    window.addEventListener('scroll', () => requestAnimationFrame(trackScrollDepth));
