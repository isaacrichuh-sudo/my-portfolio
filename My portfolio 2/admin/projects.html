<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Manager | Portfolio CMS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #f1f5f9;
        }
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 260px;
            height: 100vh;
            background: #1e293b;
            padding: 30px 20px;
        }
        .sidebar h2 { font-size: 20px; margin-bottom: 30px; color: #818cf8; }
        .sidebar nav a {
            display: block;
            padding: 12px 16px;
            color: #94a3b8;
            text-decoration: none;
            border-radius: 8px;
            margin-bottom: 8px;
        }
        .sidebar nav a:hover { background: #334155; color: white; }
        .sidebar nav a.active { background: #6366f1; color: white; }
        .main-content {
            margin-left: 260px;
            padding: 30px;
        }
        .form-card {
            background: #1e293b;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #94a3b8;
        }
        input, textarea, select {
            width: 100%;
            padding: 10px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            color: white;
        }
        textarea {
            resize: vertical;
            min-height: 100px;
        }
        button {
            background: #6366f1;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
        }
        .delete-btn {
            background: #ef4444;
        }
        .project-list {
            margin-top: 30px;
        }
        .project-item {
            background: #1e293b;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .project-info {
            flex: 1;
        }
        .project-title {
            font-weight: 600;
            font-size: 18px;
            margin-bottom: 5px;
        }
        .project-meta {
            font-size: 12px;
            color: #94a3b8;
        }
        .project-actions {
            display: flex;
            gap: 10px;
        }
        .success-msg {
            background: #10b981;
            color: white;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>🎛️ Portfolio CMS</h2>
        <nav>
            <a href="dashboard.html">📊 Dashboard</a>
            <a href="design.html">🎨 Design Editor</a>
            <a href="media.html">🖼️ Media Manager</a>
            <a href="projects.html" class="active">📂 Projects</a>
            <a href="settings.html">⚙️ Settings</a>
        </nav>
    </div>
    <div class="main-content">
        <div class="header-bar" style="margin-bottom: 30px;">
            <h1>📂 Project Manager</h1>
        </div>

        <div class="success-msg" id="successMsg">✓ Project saved successfully!</div>

        <!-- Add/Edit Project Form -->
        <div class="form-card">
            <h3 style="margin-bottom: 20px;">➕ Add New Project</h3>
            <div class="grid-2">
                <div class="form-group">
                    <label>Project Title</label>
                    <input type="text" id="projectTitle" placeholder="e.g., Pinnacle Systems - Website Copy">
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <select id="projectCategory">
                        <option value="landing">Landing Page</option>
                        <option value="email">Email Campaign</option>
                        <option value="blog">Blog Content</option>
                        <option value="case-study">Case Study</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Client Name</label>
                    <input type="text" id="projectClient" placeholder="Client or Company Name">
                </div>
                <div class="form-group">
                    <label>Results / Impact</label>
                    <input type="text" id="projectResults" placeholder="e.g., 40% increase in conversions">
                </div>
                <div class="form-group">
                    <label>Year / Date</label>
                    <input type="text" id="projectDate" placeholder="2024">
                </div>
                <div class="form-group">
                    <label>Project Image (Filename from Media Manager)</label>
                    <input type="text" id="projectImage" placeholder="filename.jpg (upload in Media Manager first)">
                    <small style="color: #94a3b8;">Tip: Go to Media Manager, upload image, then copy filename</small>
                </div>
            </div>
            <div class="form-group">
                <label>Project Description</label>
                <textarea id="projectDescription" placeholder="Describe the project, your process, and the results..."></textarea>
            </div>
            <button onclick="addProject()">➕ Add Project</button>
        </div>

        <!-- Existing Projects List -->
        <h3 style="margin: 30px 0 15px;">📋 Your Projects</h3>
        <div id="projectsList" class="project-list"></div>
    </div>

    <script>
        let projects = [];
        let editId = null;

        function loadProjects() {
            const saved = localStorage.getItem('portfolioProjects');
            if(saved) {
                projects = JSON.parse(saved);
            } else {
                projects = [];
            }
            renderProjects();
        }

        function renderProjects() {
            const container = document.getElementById('projectsList');
            if(projects.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #94a3b8;">No projects yet. Add your first project above!</p>';
                return;
            }
            
            container.innerHTML = projects.map((project, index) => `
                <div class="project-item">
                    <div class="project-info">
                        <div class="project-title">${escapeHtml(project.title)}</div>
                        <div class="project-meta">${project.category} | ${project.client || 'No client'} | ${project.results || 'No results'} | ${project.date || 'No date'}</div>
                        <div class="project-meta" style="margin-top: 5px;">${project.description.substring(0, 100)}${project.description.length > 100 ? '...' : ''}</div>
                        ${project.image ? `<div class="project-meta">📷 Image: ${project.image}</div>` : ''}
                    </div>
                    <div class="project-actions">
                        <button onclick="editProject(${index})">✏️ Edit</button>
                        <button class="delete-btn" onclick="deleteProject(${index})">🗑️ Delete</button>
                    </div>
                </div>
            `).join('');
        }

        function addProject() {
            const newProject = {
                id: Date.now(),
                title: document.getElementById('projectTitle').value,
                category: document.getElementById('projectCategory').value,
                description: document.getElementById('projectDescription').value,
                client: document.getElementById('projectClient').value,
                results: document.getElementById('projectResults').value,
                date: document.getElementById('projectDate').value,
                image: document.getElementById('projectImage').value
            };
            
            if(!newProject.title || !newProject.description) {
                alert('Please fill in project title and description');
                return;
            }
            
            projects.push(newProject);
            localStorage.setItem('portfolioProjects', JSON.stringify(projects));
            
            // Also save as JSON file for website to read
            saveProjectsToFile();
            
            // Clear form
            document.getElementById('projectTitle').value = '';
            document.getElementById('projectDescription').value = '';
            document.getElementById('projectClient').value = '';
            document.getElementById('projectResults').value = '';
            document.getElementById('projectDate').value = '';
            document.getElementById('projectImage').value = '';
            
            renderProjects();
            
            const msg = document.getElementById('successMsg');
            msg.style.display = 'block';
            setTimeout(() => msg.style.display = 'none', 2000);
        }

        function editProject(index) {
            const project = projects[index];
            document.getElementById('projectTitle').value = project.title;
            document.getElementById('projectCategory').value = project.category;
            document.getElementById('projectDescription').value = project.description;
            document.getElementById('projectClient').value = project.client || '';
            document.getElementById('projectResults').value = project.results || '';
            document.getElementById('projectDate').value = project.date || '';
            document.getElementById('projectImage').value = project.image || '';
            
            // Remove the old project
            projects.splice(index, 1);
            renderProjects();
        }

        function deleteProject(index) {
            if(confirm('Delete this project?')) {
                projects.splice(index, 1);
                localStorage.setItem('portfolioProjects', JSON.stringify(projects));
                saveProjectsToFile();
                renderProjects();
            }
        }

        function saveProjectsToFile() {
            const dataStr = JSON.stringify(projects, null, 2);
            const blob = new Blob([dataStr], {type: 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'projects.json';
            a.click();
            URL.revokeObjectURL(url);
        }

        function escapeHtml(text) {
            if(!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        loadProjects();
    </script>
</body>
</html>
