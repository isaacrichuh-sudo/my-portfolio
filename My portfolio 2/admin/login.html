<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>✍️</text></svg>">
    <title>Admin Login | Qreative Content</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-container {
            background: #1e293b;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            border: 1px solid #334155;
        }
        .logo-area {
            text-align: center;
            margin-bottom: 10px;
        }
        .logo-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }
        h1 {
            color: #f1f5f9;
            text-align: center;
            margin-bottom: 8px;
            font-size: 28px;
        }
        .subtitle {
            color: #94a3b8;
            text-align: center;
            font-size: 13px;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #94a3b8;
            font-size: 14px;
        }
        .password-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        input {
            width: 100%;
            padding: 12px 16px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        input:focus {
            outline: none;
            border-color: #818cf8;
        }
        input.error {
            border-color: #ef4444;
        }
        .password-toggle {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            font-size: 18px;
            padding: 0;
            width: auto;
            transition: color 0.3s;
        }
        .password-toggle:hover {
            color: #818cf8;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #818cf8;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        button:hover {
            background: #6366f1;
            transform: translateY(-2px);
        }
        button:disabled {
            background: #475569;
            cursor: not-allowed;
            transform: none;
        }
        .message {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }
        .message.error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid #ef4444;
            color: #fca5a5;
            display: block;
        }
        .message.success {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid #10b981;
            color: #6ee7b7;
            display: block;
        }
        .loading {
            display: none;
            text-align: center;
            margin-top: 15px;
            color: #94a3b8;
        }
        .loading.show {
            display: block;
        }
        .field-error {
            color: #ef4444;
            font-size: 12px;
            margin-top: 5px;
            display: none;
        }
        .field-error.show {
            display: block;
        }
        .divider {
            margin: 20px 0;
            text-align: center;
            border-top: 1px solid #334155;
            position: relative;
        }
        .divider span {
            background: #1e293b;
            padding: 0 10px;
            position: relative;
            top: -11px;
            color: #94a3b8;
            font-size: 12px;
        }
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo-area">
            <div class="logo-icon">🎛️</div>
        </div>
        <h1>Admin Login</h1>
        <p class="subtitle">- Secure Access -</p>
        
        <div id="messageBox" class="message" style="display: none;"></div>

        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="admin@example.com" autocomplete="email">
            <div class="field-error" id="emailError">Please enter a valid email address</div>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <div class="password-wrapper">
                <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password">
                <button type="button" class="password-toggle" id="togglePassword" aria-label="Toggle password visibility">👁️</button>
            </div>
            <div class="field-error" id="passwordError">Please enter your password</div>
        </div>

        <button id="loginBtn">Log In</button>
        
        <div class="loading" id="loadingMsg">
            <span class="spinner"></span> Logging in...
        </div>

        <div class="divider">
            <span>Secure Access</span>
        </div>
    </div>

    <script>
        // ========== SUPABASE CONFIGURATION ==========
        const SUPABASE_URL = 'https://ooarghgxjbxqgnmjwpdj.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9vYXJnaGd4amJ4cWdubWp3cGRqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg5NzM1MzQsImV4cCI6MjA5NDU0OTUzNH0.7zkOuh4F8lkSIaDnMEm9-R8v3sepjxnz0P4BKOI-HaM';
        
        // Initialize Supabase client for login
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
            auth: {
                autoRefreshToken: false,
                persistSession: false,
                detectSessionInUrl: false
            }
        });

        console.log('Login page loaded - Supabase client initialized');

        // DOM Elements
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('loginBtn');
        const messageBox = document.getElementById('messageBox');
        const loadingMsg = document.getElementById('loadingMsg');
        const emailError = document.getElementById('emailError');
        const passwordError = document.getElementById('passwordError');
        const togglePassword = document.getElementById('togglePassword');

        // Show/Hide Password Toggle
        if (togglePassword) {
            togglePassword.addEventListener('click', function() {
                if (passwordInput.type === 'password') {
                    passwordInput.type = 'text';
                    togglePassword.textContent = '🙈';
                } else {
                    passwordInput.type = 'password';
                    togglePassword.textContent = '👁️';
                }
            });
        }

        // Clear errors on input
        emailInput.addEventListener('input', function() {
            emailInput.classList.remove('error');
            emailError.classList.remove('show');
            hideMessage();
        });
        
        passwordInput.addEventListener('input', function() {
            passwordInput.classList.remove('error');
            passwordError.classList.remove('show');
            hideMessage();
        });

        // Message functions
        function showMessage(text, isError = true) {
            messageBox.textContent = text;
            messageBox.className = 'message ' + (isError ? 'error' : 'success');
        }

        function hideMessage() {
            messageBox.className = 'message';
            messageBox.textContent = '';
        }

        // Form validation
        function validateForm() {
            let isValid = true;
            
            const email = emailInput.value.trim();
            if (!email) {
                emailInput.classList.add('error');
                emailError.textContent = 'Please enter your email address';
                emailError.classList.add('show');
                isValid = false;
            } else if (!email.includes('@') || !email.includes('.')) {
                emailInput.classList.add('error');
                emailError.textContent = 'Please enter a valid email address';
                emailError.classList.add('show');
                isValid = false;
            } else {
                emailInput.classList.remove('error');
                emailError.classList.remove('show');
            }
            
            const password = passwordInput.value;
            if (!password) {
                passwordInput.classList.add('error');
                passwordError.textContent = 'Please enter your password';
                passwordError.classList.add('show');
                isValid = false;
            } else if (password.length < 6) {
                passwordInput.classList.add('error');
                passwordError.textContent = 'Password must be at least 6 characters';
                passwordError.classList.add('show');
                isValid = false;
            } else {
                passwordInput.classList.remove('error');
                passwordError.classList.remove('show');
            }
            
            return isValid;
        }

        // Login function using Supabase client
        async function login() {
            console.log('Login function called');
            
            if (!validateForm()) {
                console.log('Form validation failed');
                return;
            }
            
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            
            console.log('Attempting login for:', email);
            
            // Disable button and show loading state
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span class="spinner"></span> Logging in...';
            loadingMsg.classList.add('show');
            hideMessage();
            
            try {
                // Use Supabase client for authentication
                const { data, error } = await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });
                
                if (error) {
                    console.error('Login error:', error);
                    
                    // Handle specific error messages
                    if (error.message.includes('Invalid login credentials')) {
                        showMessage('Invalid email or password. Please try again.', true);
                    } else if (error.message.includes('Email not confirmed')) {
                        showMessage('Please confirm your email address before logging in.', true);
                    } else {
                        showMessage(error.message, true);
                    }
                    
                    emailInput.classList.add('error');
                    passwordInput.classList.add('error');
                    return;
                }
                
                if (data && data.session) {
                    console.log('Login successful!');
                    
                    // Store tokens in localStorage for other pages to use
                    localStorage.setItem('supabase_token', data.session.access_token);
                    localStorage.setItem('supabase_refresh_token', data.session.refresh_token);
                    
                    // Also store user info if needed
                    if (data.user) {
                        console.log('Logged in as:', data.user.email);
                    }
                    
                    showMessage('✓ Login successful! Redirecting...', false);
                    
                    // Redirect after a short delay
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1000);
                } else {
                    showMessage('Login failed. No session returned.', true);
                }
            } catch (err) {
                console.error('Unexpected login error:', err);
                showMessage('Connection error. Please check your internet and try again.', true);
            } finally {
                // Re-enable button
                loginBtn.disabled = false;
                loginBtn.textContent = 'Log In';
                loadingMsg.classList.remove('show');
            }
        }

        // Event listeners
        loginBtn.addEventListener('click', login);

        passwordInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') login();
        });
        
        emailInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                passwordInput.focus();
            }
        });

        // Check if already logged in with a valid session
        async function checkExistingSession() {
            const token = localStorage.getItem('supabase_token');
            const refreshToken = localStorage.getItem('supabase_refresh_token');
            
            if (!token) {
                console.log('No existing token found');
                return;
            }
            
            console.log('Found existing token, verifying...');
            
            // Create a temporary client to verify the token
            const tempClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
                auth: {
                    autoRefreshToken: true,
                    persistSession: true,
                    detectSessionInUrl: false
                }
            });
            
            try {
                const { data, error } = await tempClient.auth.setSession({
                    access_token: token,
                    refresh_token: refreshToken || ''
                });
                
                if (error) {
                    console.log('Stored token is invalid, clearing...');
                    localStorage.removeItem('supabase_token');
                    localStorage.removeItem('supabase_refresh_token');
                    return;
                }
                
                if (data?.session) {
                    console.log('Valid session found, redirecting to dashboard...');
                    // Update tokens in case they were refreshed
                    localStorage.setItem('supabase_token', data.session.access_token);
                    localStorage.setItem('supabase_refresh_token', data.session.refresh_token);
                    window.location.href = 'dashboard.html';
                }
            } catch (err) {
                console.error('Error checking session:', err);
                // If there's an error, clear tokens and stay on login page
                localStorage.removeItem('supabase_token');
                localStorage.removeItem('supabase_refresh_token');
            }
        }
        
        // Run session check on page load
        checkExistingSession();
        
        // Focus email input on page load
        emailInput.focus();
        
        console.log('Login page ready - waiting for user input');
    </script>
</body>
</html>
