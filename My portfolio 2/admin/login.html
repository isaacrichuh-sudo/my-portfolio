<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Qreative Content</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-container {
            background: #1e293b;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            border: 1px solid #334155;
        }
        h1 {
            color: #f1f5f9;
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #94a3b8;
            font-size: 14px;
        }
        .password-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        input {
            width: 100%;
            padding: 12px 16px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: white;
            font-size: 16px;
        }
        input:focus {
            outline: none;
            border-color: #818cf8;
        }
        input.error {
            border-color: #ef4444;
        }
        .password-toggle {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            font-size: 18px;
            padding: 0;
            width: auto;
        }
        .password-toggle:hover {
            color: #818cf8;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #818cf8;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        button:hover {
            background: #6366f1;
            transform: translateY(-2px);
        }
        button:disabled {
            background: #475569;
            cursor: not-allowed;
        }
        .message {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }
        .message.error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid #ef4444;
            color: #fca5a5;
        }
        .message.success {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid #10b981;
            color: #6ee7b7;
        }
        .message.show {
            display: block;
        }
        .loading {
            display: none;
            text-align: center;
            margin-top: 15px;
            color: #94a3b8;
        }
        .loading.show {
            display: block;
        }
        .field-error {
            color: #ef4444;
            font-size: 12px;
            margin-top: 5px;
            display: none;
        }
        .field-error.show {
            display: block;
        }
        .divider {
            margin: 20px 0;
            text-align: center;
            border-top: 1px solid #334155;
            position: relative;
        }
        .divider span {
            background: #1e293b;
            padding: 0 10px;
            position: relative;
            top: -11px;
            color: #94a3b8;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>🔐 Admin Login</h1>
        
        <div id="messageBox" class="message error"></div>

        <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="email" placeholder="admin@example.com">
            <div class="field-error" id="emailError">Please enter a valid email address</div>
        </div>

        <div class="form-group">
            <label>Password</label>
            <div class="password-wrapper">
                <input type="password" id="password" placeholder="Enter your password">
                <button type="button" class="password-toggle" id="togglePassword">👁️</button>
            </div>
            <div class="field-error" id="passwordError">Please enter your password</div>
        </div>

        <button id="loginBtn">Log In</button>
        
        <div class="loading" id="loadingMsg">
            ⏳ Logging in...
        </div>

        <div class="divider">
            <span>Secure Access</span>
        </div>
    </div>

    <script>
        // Simple test to confirm script is running
        console.log('Login page loaded - script is running!');
        
        // DOM Elements
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('loginBtn');
        const messageBox = document.getElementById('messageBox');
        const loadingMsg = document.getElementById('loadingMsg');
        const emailError = document.getElementById('emailError');
        const passwordError = document.getElementById('passwordError');
        const togglePassword = document.getElementById('togglePassword');

        // Show/Hide Password Toggle
        if (togglePassword) {
            togglePassword.addEventListener('click', function() {
                console.log('Toggle clicked');
                if (passwordInput.type === 'password') {
                    passwordInput.type = 'text';
                    togglePassword.textContent = '🙈';
                } else {
                    passwordInput.type = 'password';
                    togglePassword.textContent = '👁️';
                }
            });
        }

        // Clear errors on input
        emailInput.addEventListener('input', function() {
            emailInput.classList.remove('error');
            emailError.classList.remove('show');
            messageBox.classList.remove('show');
        });
        
        passwordInput.addEventListener('input', function() {
            passwordInput.classList.remove('error');
            passwordError.classList.remove('show');
            messageBox.classList.remove('show');
        });

        function showMessage(text, isError = true) {
            messageBox.textContent = text;
            messageBox.className = 'message ' + (isError ? 'error' : 'success');
            messageBox.classList.add('show');
        }

        function validateForm() {
            let isValid = true;
            
            const email = emailInput.value.trim();
            if (!email) {
                emailInput.classList.add('error');
                emailError.classList.add('show');
                isValid = false;
            } else if (!email.includes('@')) {
                emailInput.classList.add('error');
                emailError.textContent = 'Please enter a valid email address';
                emailError.classList.add('show');
                isValid = false;
            } else {
                emailInput.classList.remove('error');
                emailError.classList.remove('show');
            }
            
            const password = passwordInput.value;
            if (!password) {
                passwordInput.classList.add('error');
                passwordError.classList.add('show');
                isValid = false;
            } else {
                passwordInput.classList.remove('error');
                passwordError.classList.remove('show');
            }
            
            return isValid;
        }

        async function login() {
            console.log('Login function called');
            
            if (!validateForm()) {
                console.log('Form validation failed');
                return;
            }
            
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            
            console.log('Attempting login for:', email);
            
            loginBtn.disabled = true;
            loginBtn.textContent = 'Logging in...';
            loadingMsg.classList.add('show');
            messageBox.classList.remove('show');
            
            try {
                // Simple fetch to test if Supabase is reachable
                console.log('Testing Supabase connection...');
                
                const response = await fetch('https://ooarghgxjbxqgnmjwpdj.supabase.co/rest/v1/', {
                    headers: {
                        'apikey': 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9vYXJnaGd4amJ4cWdubWp3cGRqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg5NzM1MzQsImV4cCI6MjA5NDU0OTUzNH0.7zkOuh4F8lkSIaDnMEm9-R8v3sepjxnz0P4BKOI-HaM'
                    }
                });
                console.log('Supabase connection test status:', response.status);
                
                // Now try to login
                const loginResponse = await fetch('https://ooarghgxjbxqgnmjwpdj.supabase.co/auth/v1/token?grant_type=password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'apikey': 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9vYXJnaGd4amJ4cWdubWp3cGRqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg5NzM1MzQsImV4cCI6MjA5NDU0OTUzNH0.7zkOuh4F8lkSIaDnMEm9-R8v3sepjxnz0P4BKOI-HaM'
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                });
                
                const data = await loginResponse.json();
                console.log('Login response:', loginResponse.status, data);
                
                if (loginResponse.ok && data.access_token) {
                    localStorage.setItem('supabase_token', data.access_token);
                    localStorage.setItem('supabase_refresh_token', data.refresh_token);
                    showMessage('Login successful! Redirecting...', false);
                    
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1500);
                } else {
                    let errorMsg = 'Invalid email or password';
                    if (data.msg) errorMsg = data.msg;
                    if (data.error_description) errorMsg = data.error_description;
                    showMessage(errorMsg, true);
                    emailInput.classList.add('error');
                    passwordInput.classList.add('error');
                }
            } catch (err) {
                console.error('Login error:', err);
                showMessage('Connection error: ' + err.message, true);
            } finally {
                loginBtn.disabled = false;
                loginBtn.textContent = 'Log In';
                loadingMsg.classList.remove('show');
            }
        }

        loginBtn.onclick = login;

        passwordInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') login();
        });
        
        emailInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') login();
        });

        // Check if already logged in
        async function checkSession() {
            const token = localStorage.getItem('supabase_token');
            if (token) {
                console.log('Found existing token, redirecting...');
                window.location.href = 'dashboard.html';
            }
        }
        checkSession();
        
        console.log('Login page ready - waiting for user input');
    </script>
</body>
</html>
