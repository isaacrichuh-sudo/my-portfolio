<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work | Qreative Content - Portfolio</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    // ========== SUPABASE CONFIGURATION ==========
    const SUPABASE_URL = 'https://ooarghgxjbxqgnmjwpdj.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9vYXJnaGd4amJ4cWdubWp3cGRqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg5NzM1MzQsImV4cCI6MjA5NDU0OTUzNH0.7zkOuh4F8lkSIaDnMEm9-R8v3sepjxnz0P4BKOI-HaM';
    
    let supabaseClient;
    
    // ========== WEBSITE ANALYTICS ==========
    function getOrCreateVisitorId() {
        let visitorId = localStorage.getItem('visitorId');
        if(!visitorId) {
            visitorId = 'visitor_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
            localStorage.setItem('visitorId', visitorId);
            const visitInfo = {
                visitorId: visitorId,
                firstVisit: new Date().toISOString(),
                pagesVisited: [window.location.pathname],
                totalVisits: 1
            };
            localStorage.setItem('visitorInfo', JSON.stringify(visitInfo));
        } else {
            const visitInfo = JSON.parse(localStorage.getItem('visitorInfo') || '{}');
            visitInfo.totalVisits = (visitInfo.totalVisits || 0) + 1;
            if(!visitInfo.pagesVisited.includes(window.location.pathname)) {
                visitInfo.pagesVisited.push(window.location.pathname);
            }
            localStorage.setItem('visitorInfo', JSON.stringify(visitInfo));
        }
        return visitorId;
    }
    
    function trackPageView() {
        getOrCreateVisitorId();
        const pageViews = JSON.parse(localStorage.getItem('pageViews') || '[]');
        pageViews.push({
            page: window.location.pathname,
            timestamp: new Date().toISOString(),
            referrer: document.referrer || 'direct',
            userAgent: navigator.userAgent
        });
        localStorage.setItem('pageViews', JSON.stringify(pageViews));
    }
    
    function trackButtonClick(buttonName, buttonLocation) {
        const clicks = JSON.parse(localStorage.getItem('buttonClicks') || '[]');
        clicks.push({
            buttonName: buttonName,
            location: buttonLocation,
            timestamp: new Date().toISOString(),
            page: window.location.pathname
        });
        localStorage.setItem('buttonClicks', JSON.stringify(clicks));
    }
    
    let maxScrollDepth = 0;
    function trackScrollDepth() {
        const scrollPercent = (window.scrollY + window.innerHeight) / document.documentElement.scrollHeight * 100;
        if(scrollPercent > maxScrollDepth) {
            const newDepth = Math.min(Math.floor(scrollPercent / 25) * 25, 100);
            if(newDepth > maxScrollDepth && newDepth > 0) {
                maxScrollDepth = newDepth;
                const scrollData = JSON.parse(localStorage.getItem('scrollDepth') || '[]');
                scrollData.push({ depth: maxScrollDepth, timestamp: new Date().toISOString(), page: window.location.pathname });
                localStorage.setItem('scrollDepth', JSON.stringify(scrollData));
            }
        }
    }
    
    function trackFilterClick(filterName) {
        const filters = JSON.parse(localStorage.getItem('filterClicks') || '[]');
        filters.push({ filter: filterName, timestamp: new Date().toISOString(), page: window.location.pathname });
        localStorage.setItem('filterClicks', JSON.stringify(filters));
    }
    
    // ========== SUPABASE FUNCTIONS ==========
    async function initSupabase() {
        supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        console.log('Supabase initialized');
        await loadData();
        applyDesignSettings();
        loadChatOptions();
    }
    
    // ========== LOAD DATA FROM SUPABASE ==========
    let allProjects = [];
    let currentFilter = "all";

    async function loadData() {
        const { data: projects, error } = await supabaseClient
            .from('projects')
            .select('*')
            .order('created_at', { ascending: false });
        
        if(error) {
            console.error('Error loading projects:', error);
            allProjects = [];
        } else if(projects && projects.length > 0) {
            allProjects = projects;
        } else {
            // Fallback to localStorage if Supabase is empty
            const savedProjects = localStorage.getItem('portfolioProjects');
            if(savedProjects) {
                allProjects = JSON.parse(savedProjects);
            } else {
                allProjects = [];
            }
        }
        renderProjects();
    }

    function getImageForProject(project) {
        if(!project.image) return null;
        if(project.image.startsWith('http')) return project.image;
        return `images/${project.image}`;
    }

    function getCategoryIcon(category) {
        const icons = { 'landing': '📄', 'email': '✉️', 'blog': '📝', 'case-study': '📊' };
        return icons[category] || '📂';
    }

    function getCategoryName(category) {
        const names = { 'landing': 'LANDING PAGE', 'email': 'EMAIL CAMPAIGN', 'blog': 'BLOG CONTENT', 'case-study': 'CASE STUDY' };
        return names[category] || category.toUpperCase();
    }

    function openModal(imageSrc) {
        if(!imageSrc) return;
        const modal = document.getElementById('imageModal');
        const modalImage = document.getElementById('modalImage');
        modalImage.src = imageSrc;
        modal.classList.add('active');
        document.body.style.overflow = 'hidden';
    }
    
    function closeModal() {
        const modal = document.getElementById('imageModal');
        modal.classList.remove('active');
        document.body.style.overflow = '';
    }

    function toggleReadMore(button, descriptionId) {
        const descElement = document.getElementById(descriptionId);
        if (descElement.classList.contains('collapsed')) {
            descElement.classList.remove('collapsed');
            button.textContent = 'Read less';
        } else {
            descElement.classList.add('collapsed');
            button.textContent = 'Read more';
        }
    }

    function renderProjects() {
        const grid = document.getElementById('projectsGrid');
        
        if(!allProjects.length) {
            grid.innerHTML = `<div class="empty-state"><p>📂 No projects yet.</p><a href="admin/projects.html" class="empty-state-link" style="background: var(--accent); color: white; padding: 12px 24px; border-radius: 40px; text-decoration: none; display: inline-block; margin-top: 15px;">Go to Admin Panel to Add Projects</a></div>`;
            return;
        }
        
        let filtered = allProjects;
        if(currentFilter !== "all") {
            filtered = allProjects.filter(p => p.category === currentFilter);
        }
        
        if(filtered.length === 0) {
            grid.innerHTML = `<div class="empty-state"><p>📭 No projects in this category yet.</p><button onclick="document.querySelector('.filter-btn[data-filter=\\'all\\']').click()" class="empty-state-btn" style="background: var(--accent); color: white; padding: 10px 20px; border-radius: 40px; border: none; cursor: pointer;">View All Projects</button></div>`;
            return;
        }
        
        grid.innerHTML = filtered.map((project, index) => {
            const imageUrl = getImageForProject(project);
            const hasImage = imageUrl;
            const descriptionId = `desc-${project.id || index}`;
            const isLongDescription = project.description && project.description.length > 150;
            
            return `
                <div class="project-card">
                    <div class="project-image-container" onclick="openModal('${hasImage ? imageUrl.replace(/'/g, "\\'") : ''}')">
                        ${hasImage ? 
                            `<img src="${imageUrl}" class="project-image" alt="${escapeHtml(project.title)}" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%27200%27 height=%27200%27 viewBox=%270 0 200 200%27%3E%3Crect width=%27200%27 height=%27200%27 fill=%27%23818cf8%27/%3E%3Ctext x=%2750%25%27 y=%2750%25%27 text-anchor=%27middle%27 dy=%27.3em%27 fill=%27white%27%3ENo Image%3C/text%3E%3C/svg%3E'">` : 
                            `<div class="no-image-placeholder">
                                ${getCategoryIcon(project.category)}
                                <span>Add image</span>
                             </div>`
                        }
                        <div class="image-zoom-overlay">
                            <span class="zoom-icon">🔍 Click to zoom</span>
                        </div>
                    </div>
                    <div class="project-content">
                        <div class="project-category">${getCategoryIcon(project.category)} ${getCategoryName(project.category)}</div>
                        <h3 class="project-title">${escapeHtml(project.title)}</h3>
                        <div class="project-description-wrapper">
                            <div id="${descriptionId}" class="project-description ${isLongDescription ? 'collapsed' : ''}">
                                ${escapeHtml(project.description)}
                            </div>
                            ${isLongDescription ? `<button class="read-more-btn" onclick="toggleReadMore(this, '${descriptionId}')">Read more</button>` : ''}
                        </div>
                        ${project.client ? `<div class="project-client">👤 ${escapeHtml(project.client)}</div>` : ''}
                        ${project.results ? `<div class="project-results">📈 ${escapeHtml(project.results)}</div>` : ''}
                        ${project.date ? `<div class="project-date">📅 ${escapeHtml(project.date)}</div>` : ''}
                    </div>
                </div>
            `;
        }).join('');
    }

    function loadPersonalInfo() {
        const personalInfo = JSON.parse(localStorage.getItem('personalInfo') || '{}');
        const firstName = (personalInfo.name || 'Qreative').split(' ')[0];
        const logoElement = document.getElementById('logoText');
        if(logoElement) logoElement.innerHTML = `✍️ ${firstName}`;
        const footerElement = document.getElementById('footerText');
        if(footerElement) footerElement.innerHTML = `© 2026 ${personalInfo.name || 'Qreative Content'} | ${personalInfo.title || 'SaaS Copywriter'}`;
    }

    function applyDesignSettings() {
        const designSettings = JSON.parse(localStorage.getItem('designSettings') || '{}');
        if(designSettings.colors) {
            document.documentElement.style.setProperty('--accent', designSettings.colors.primary || '#818cf8');
            document.documentElement.style.setProperty('--accent-hover', designSettings.colors.secondary || '#6366f1');
            document.documentElement.style.setProperty('--bg-primary', designSettings.colors.background || '#f8fafc');
            document.documentElement.style.setProperty('--bg-card', designSettings.colors.cardBg || '#ffffff');
        }
    }

    // ========== MULTI-OPTION CHAT BUTTON ==========
    function loadChatOptions() {
        const chatSettings = JSON.parse(localStorage.getItem('chatSettings') || '{}');
        const personalInfo = JSON.parse(localStorage.getItem('personalInfo') || '{}');
        
        let phoneNumber = chatSettings.whatsappNumber || chatSettings.phoneNumber || '254700000000';
        const name = chatSettings.name || personalInfo.name || 'Copywriter';
        const defaultMessage = chatSettings.messageTemplate || `Hi ${name}, I saw your portfolio website and would like to discuss a potential project.`;
        
        let cleanNumber = phoneNumber.replace(/\D/g, '');
        if (cleanNumber.startsWith('0')) cleanNumber = '254' + cleanNumber.substring(1);
        if (!cleanNumber.startsWith('254') && !cleanNumber.startsWith('+')) cleanNumber = '254' + cleanNumber;
        
        const whatsappLink = `https://wa.me/${cleanNumber}?text=${encodeURIComponent(defaultMessage)}`;
        const whatsappOption = document.getElementById('whatsappOption');
        if (whatsappOption) whatsappOption.href = whatsappLink;
        
        const email = chatSettings.email || personalInfo.email || 'your.email@example.com';
        const emailSubject = encodeURIComponent(chatSettings.emailSubject || 'Inquiry from Portfolio Website');
        const emailBody = encodeURIComponent(chatSettings.emailBody || defaultMessage);
        const emailLink = `mailto:${email}?subject=${emailSubject}&body=${emailBody}`;
        const emailOption = document.getElementById('emailOption');
        if (emailOption) emailOption.href = emailLink;
        
        const facebookPage = chatSettings.facebookPage || 'https://facebook.com/yourpage';
        const facebookOption = document.getElementById('facebookOption');
        if (facebookOption) facebookOption.href = facebookPage;
    }

    // Multi-float button toggle
    const chatMainBtn = document.getElementById('chatMainBtn');
    const chatOptionsPanel = document.getElementById('chatOptions');
    const chatCloseBtn = document.getElementById('chatCloseBtn');
    let isChatOpen = false;

    function toggleChatOptions() {
        isChatOpen = !isChatOpen;
        if (isChatOpen) {
            chatOptionsPanel.classList.add('active');
        } else {
            chatOptionsPanel.classList.remove('active');
        }
    }

    if (chatMainBtn) {
        chatMainBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleChatOptions();
            trackButtonClick('Multi-Float Button', 'Bottom Right');
        });
    }

    if (chatCloseBtn) {
        chatCloseBtn.addEventListener('click', () => {
            isChatOpen = false;
            chatOptionsPanel.classList.remove('active');
            trackButtonClick('Close Multi-Float', 'Multi-Float Menu');
        });
    }

    document.addEventListener('click', (e) => {
        if (!e.target.closest('.chat-float')) {
            isChatOpen = false;
            if (chatOptionsPanel) chatOptionsPanel.classList.remove('active');
        }
    });

    // Track CTA button clicks
    const ctaExplore = document.getElementById('ctaExploreExpertise');
    const ctaSpecific = document.getElementById('ctaNeedSpecific');
    if(ctaExplore) ctaExplore.addEventListener('click', () => trackButtonClick('Explore Expertise', 'CTA Section'));
    if(ctaSpecific) ctaSpecific.addEventListener('click', () => trackButtonClick('Need Something Specific', 'CTA Section'));

    // Dark Mode
    const themeToggle = document.getElementById("themeToggle");
    const body = document.body;
    if (localStorage.getItem("darkMode") === "enabled") {
        body.classList.add("dark");
        themeToggle.textContent = "Light mode";
    } else {
        themeToggle.textContent = "Dark mode";
    }
    themeToggle.addEventListener("click", () => {
        body.classList.toggle("dark");
        if (body.classList.contains("dark")) {
            localStorage.setItem("darkMode", "enabled");
            themeToggle.textContent = "Light mode";
        } else {
            localStorage.setItem("darkMode", "disabled");
            themeToggle.textContent = "Dark mode";
        }
        trackButtonClick('Dark Mode Toggle', body.classList.contains('dark') ? 'Switch to Dark' : 'Switch to Light');
    });

    // Track filter clicks
    const filterBtns = document.querySelectorAll('.filter-btn');
    filterBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            filterBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentFilter = btn.getAttribute('data-filter');
            trackFilterClick(currentFilter);
            renderProjects();
        });
    });

    function escapeHtml(text) {
        if(!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // ========== CHATBOT FUNCTIONS ==========
    const AGENT_NAME = "Sarah";
    const AGENT_AVATAR_URL = "chat bot sarah.png";
    const typingConfig = { simpleResponseDelay: 2000, complexResponseDelay: 3500, greetingDelay: 1500, fallbackDelay: 2000 };
    
    document.getElementById('agentAvatarImage').src = AGENT_AVATAR_URL;
    document.getElementById('headerAvatarImage').src = AGENT_AVATAR_URL;
    
    const knowledgeBase = [
        { patterns: ["services", "offer", "do you do", "what can you do", "help with", "what services"], response: "I offer a range of copywriting services including: 📝 Website Copywriting, Designing and Development, 📝 Email Marketing Campaigns, 📝 Search Engine Optimized Blog Content, 📝 Landing Pages design, and 📝 Search Engine Optimization Content Strategy. Any specific service you're interested in?" },
        { patterns: ["price", "cost", "pricing", "rates", "how much", "fee", "charge", "budget", "quote", "estimate"], response: "Most projects range from $200 - $3000 depending on scope. A landing page typically starts at $200, while full website copy and web development can range from $800-$3000. However, my greatest priority is to see your project grow and will offer great discounts for a start. Would you like a custom quote?" },
        { patterns: ["how long", "timeline", "turnaround", "delivery", "fast", "speed", "deadline", "days"], response: "Typical turnaround times: Landing pages: 3-5 days, Email sequences: 5-7 days, Full website copy: 7-14 days. I always provide clear timelines before starting. What project do you have in mind?" },
        { patterns: ["experience", "background", "how long", "years", "portfolio", "clients", "qualifications"], response: "I specialize in B2B SaaS copywriting with over 4 years of experience. I've worked with 50+ clients across fintech, logistics, healthcare tech, and e-commerce. Check out my Work page to see real results!" },
        { patterns: ["build website", "create website", "make website", "website development", "web design", "can you build", "web developer"], response: "Yes we do! We build fully custom, SEO-optimized websites from scratch. I work with a team of expert developers who handle the technical build, while I focus on copywriting and design, content strategy and search engine optimization to ensure your site not only looks great but also ranks on Google and converts visitors into customers. Would you like to discuss your website needs? 💚" },
        { patterns: ["contact", "reach", "email", "whatsapp", "chat", "get in touch", "message you"], response: "I'd love to interact with you. You can reach me via the buttons indicated 'WhatsApp', 'E-mail' or 'Facebook' on this page. You can also use the contact form on the Contact page. I respond within 24 hours! 💚" },
        { patterns: ["hello", "hi", "hey", "greetings", "good morning", "good afternoon"], response: "Hey! Hope you're well. How can I assist you today?" },
        { patterns: ["thanks", "thank you", "appreciate", "grateful"], response: "You're very welcome! I hope I have been of help to you. Anything else I can help you with?" },
        { patterns: ["bye", "goodbye", "see you", "later", "exit"], response: "Take care! Feel free to come back anytime. Have a wonderful day!" }
    ];
    
    function findBestMatch(userMessage) {
        const lowerMessage = userMessage.toLowerCase();
        let bestMatch = null;
        let highestScore = 0;
        for(const item of knowledgeBase) {
            let score = 0;
            for(const pattern of item.patterns) {
                if(lowerMessage.includes(pattern.toLowerCase())) score += 10;
            }
            if(score > highestScore) { highestScore = score; bestMatch = item; }
        }
        return highestScore > 2 ? bestMatch : null;
    }
    
    function saveUnrecognizedQuestion(question) {
        const unrecognized = JSON.parse(localStorage.getItem('unrecognizedQuestions') || '[]');
        unrecognized.push({ id: Date.now(), question: question, timestamp: new Date().toISOString() });
        localStorage.setItem('unrecognizedQuestions', JSON.stringify(unrecognized));
    }
    
    function getFallbackResponse(userMessage) {
        saveUnrecognizedQuestion(userMessage);
        return "Great! To give you the most accurate answer for your specific project, let's jump on a quick text chat. Click below to ping me directly on WhatsApp! 💚";
    }
    
    let chatMessages = [];
    
    function addBotMessage(text) {
        chatMessages.push({ id: Date.now(), type: 'bot', text: text });
        renderChatMessages();
    }
    
    function addUserMessage(text) {
        chatMessages.push({ id: Date.now(), type: 'user', text: text });
        renderChatMessages();
    }
    
    function renderChatMessages() {
        const container = document.getElementById('chatMessages');
        if(!container) return;
        container.innerHTML = chatMessages.map(msg => `
            <div class="message ${msg.type}">
                <div class="message-avatar">${msg.type === 'bot' ? `<img src="${AGENT_AVATAR_URL}" alt="Sarah">` : `<span>👤</span>`}</div>
                <div class="message-content">${msg.text.replace(/\n/g, '<br>')}</div>
            </div>
        `).join('');
        container.scrollTop = container.scrollHeight;
    }
    
    function showTypingIndicator() {
        const container = document.getElementById('chatMessages');
        const typingDiv = document.createElement('div');
        typingDiv.className = 'message bot';
        typingDiv.id = 'typingIndicator';
        typingDiv.innerHTML = `<div class="message-avatar"><img src="${AGENT_AVATAR_URL}" alt="Sarah"></div><div class="typing-indicator"><div class="typing-dots"><span></span><span></span><span></span></div><span class="typing-text">Sarah is typing...</span></div>`;
        container.appendChild(typingDiv);
        container.scrollTop = container.scrollHeight;
    }
    
    function hideTypingIndicator() {
        const indicator = document.getElementById('typingIndicator');
        if(indicator) indicator.remove();
    }
    
    function addChatbotWhatsAppButton() {
        const chatSettings = JSON.parse(localStorage.getItem('chatSettings') || '{}');
        let phoneNumber = chatSettings.whatsappNumber || chatSettings.phoneNumber || '254700000000';
        let cleanNumber = phoneNumber.replace(/\D/g, '');
        if (cleanNumber.startsWith('0')) cleanNumber = '254' + cleanNumber.substring(1);
        const whatsappLink = `https://wa.me/${cleanNumber}?text=${encodeURIComponent(`Hi! I was chatting with Sarah on your website and would love to discuss my project.`)}`;
        const container = document.getElementById('chatMessages');
        const buttonDiv = document.createElement('div');
        buttonDiv.className = 'message bot';
        buttonDiv.innerHTML = `<div class="message-avatar"><img src="${AGENT_AVATAR_URL}" alt="Sarah"></div><div><a href="${whatsappLink}" target="_blank" class="whatsapp-btn" id="chatbotWhatsappBtn">💚 Click to WhatsApp</a></div>`;
        container.appendChild(buttonDiv);
        container.scrollTop = container.scrollHeight;
        document.getElementById('chatbotWhatsappBtn')?.addEventListener('click', () => trackButtonClick('Chatbot WhatsApp', 'Chatbot'));
    }
    
    function addQuickReplies() {
        const container = document.getElementById('chatMessages');
        const quickRepliesDiv = document.createElement('div');
        quickRepliesDiv.className = 'message bot quick-replies-container';
        quickRepliesDiv.innerHTML = `
            <div class="message-avatar"><img src="${AGENT_AVATAR_URL}" alt="Sarah"></div>
            <div class="quick-replies">
                <button class="quick-reply-btn" data-topic="Services">📋 Check My Services</button>
                <button class="quick-reply-btn" data-topic="Pricing">💰 Product Pricing</button>
                <button class="quick-reply-btn" data-topic="Timeline">⏱️ Project Timelines</button>
                <button class="quick-reply-btn" data-topic="Experience">⭐ My Experience</button>
                <button class="quick-reply-btn" data-topic="Website">🌐 Website Help</button>
                <button class="quick-reply-btn" data-topic="Contact">📱 My Contacts</button>
            </div>
        `;
        const buttons = quickRepliesDiv.querySelectorAll('.quick-reply-btn');
        buttons.forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const topic = btn.getAttribute('data-topic');
                trackButtonClick(`Quick Reply: ${topic}`, 'Chatbot');
                processUserMessage(topic);
            });
        });
        container.appendChild(quickRepliesDiv);
        container.scrollTop = container.scrollHeight;
    }
    
    async function processUserMessage(userMessage) {
        addUserMessage(userMessage);
        const match = findBestMatch(userMessage);
        showTypingIndicator();
        await new Promise(resolve => setTimeout(resolve, typingConfig.simpleResponseDelay));
        hideTypingIndicator();
        if(match) {
            addBotMessage(match.response);
            setTimeout(() => addQuickReplies(), 800);
        } else {
            addBotMessage(getFallbackResponse(userMessage));
            setTimeout(() => addChatbotWhatsAppButton(), 1000);
        }
    }
    
    function addDelayedGreeting() {
        showTypingIndicator();
        setTimeout(() => {
            hideTypingIndicator();
            addBotMessage(`Hi! How are you doing today. I'm ${AGENT_NAME}, your assistant. How can I help you?`);
            setTimeout(() => addQuickReplies(), 800);
        }, typingConfig.greetingDelay);
    }
    
    window.sendMessage = function() {
        const input = document.getElementById('chatInput');
        const message = input.value.trim();
        if(!message) return;
        input.value = '';
        processUserMessage(message);
    };
    
    function initChatbot() {
        const toggle = document.getElementById('chatAgentToggle');
        const chatWindow = document.getElementById('chatAgentWindow');
        if(toggle) {
            toggle.addEventListener('click', (e) => {
                e.stopPropagation();
                chatWindow.classList.toggle('active');
                if(chatMessages.length === 0) addDelayedGreeting();
                trackButtonClick('Chatbot Toggle', chatWindow.classList.contains('active') ? 'Open' : 'Close');
            });
        }
        document.addEventListener('click', (e) => {
            if(!e.target.closest('.chat-agent') && chatWindow.classList.contains('active')) {
                chatWindow.classList.remove('active');
            }
        });
    }
    
    // ========== INITIALIZE EVERYTHING ==========
    trackPageView();
    window.addEventListener('scroll', () => requestAnimationFrame(trackScrollDepth));
    loadPersonalInfo();
    initSupabase();
    initChatbot();
</script>
</body>
</html>
